  Hint: ComponentQuery
  Value: |
    query ProductCollectionsQuery($datasource: String!, $language: String!) {
      datasource: item(path: $datasource, language: $language) {
        title: field(name: "Title") {
          value
        }
        tabs: field(name: "Tabs") {
          ... on MultilistField {
            targetItems {
              ...tabFields
            }
          }
        }
      }
    }
    
    fragment tabFields on ProductCollectionTabs {
      title: field(name: "Title") {
        value
      }
      description: field(name: "Description") {
        value
      }
      image: field(name: "Image") {
        jsonValue
      }
      products: field(name: "Products") {
        ... on MultilistField {
          targetItems {
            ...productFields
          }
        }
      }
    }
    
    fragment productFields on ProductVariants {
      title: field(name: "Title") {
        value
      }
      description: field(name: "Description") {
        value
      }
      productVariants: field(name: "ProductVariants") {
        ... on MultilistField {
          targetItems {
            ...productVariantFields
          }
        }
      }
    }
    
    fragment productVariantFields on ProductVariant {
      image: field(name: "Image") {
        jsonValue
      }
      variant: field(name: "Variant") {
        value
      }
      imageLink: field(name: "Image Link") {
        value
      }
    }
    
