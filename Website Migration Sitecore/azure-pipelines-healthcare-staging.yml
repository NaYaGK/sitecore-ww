    inputs:
      versionSpec: '25.x'
    displayName: 'Use Node 25'

  - script: |
      cd cws-xm-cloud-app
      npm install
    displayName: 'Install dependencies'

  - task: vercel-deployment-task@3
    displayName: 'Deploy to Vercel'
    inputs:
      vercelToken: 'mNylwPYt1twBOBLE7vdnXNYf'
      vercelOrgId: 'team_CBRPMWoRaMbI2wcESfKY8Ku0'
      vercelProjectId: 'prj_GJDZiKwWAAhH6xUDSPL7GupKsRap'
      vercelTeamId: 'team_CBRPMWoRaMbI2wcESfKY8Ku0'
      vercelCwd: 'cws-xm-cloud-app'
      production: true
