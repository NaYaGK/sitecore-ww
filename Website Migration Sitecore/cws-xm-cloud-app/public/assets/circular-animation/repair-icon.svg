<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
  <!-- Repair Icon - Needle and Thread -->
  <!-- Needle -->
  <line x1="40" y1="85" x2="75" y2="25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Needle eye -->
  <ellipse cx="42" cy="80" rx="4" ry="6" stroke="currentColor" stroke-width="2.5" fill="none" transform="rotate(-58 42 80)"/>
  <!-- Needle point -->
  <path d="M 73 28 L 78 23 L 75 25 Z" fill="currentColor"/>
  
  <!-- Thread curve -->
  <path d="M 35 82 Q 20 75, 25 60 T 40 40 T 50 30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Thread end -->
  <circle cx="50" cy="30" r="2" fill="currentColor" opacity="0.7"/>
</svg>
